name: CI

# Verificacion en cada push y pull request: sintaxis + tests unitarios.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Windows, Python 3.15)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Compile check
        run: python -m compileall -q azero main.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Version consistency
        shell: pwsh
        run: |
          $v = python -c "from azero.constants import APP_VERSION; print(APP_VERSION)".Trim()
          $iss = Get-Content -Raw installer\setup.iss
          if ($iss -notmatch ('#define AppVersion "' + [regex]::Escape($v) + '"')) {
            throw "APP_VERSION ($v) no coincide con installer\setup.iss"
          }
