name: Release

# Se ejecuta al publicar un tag v* (p. ej. v1.0.0) o manualmente.
# Genera el ejecutable nativo, el zip portable y el instalador, y los
# publica como assets del GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build executable (PyInstaller)
        run: python -m PyInstaller azero.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe no encontrado" }
          & $iscc installer\setup.iss

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\AZeroCraft -DestinationPath dist\AZeroCraft-windows-x64.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: AZeroCraft ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          files: |
            dist/AZeroCraft-Setup-*.exe
            dist/AZeroCraft-windows-x64.zip
